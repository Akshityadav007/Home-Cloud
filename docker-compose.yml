services:

  postgres:
    image: postgres:16
    container_name: home_cloud_postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: home_cloud
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: home_cloud_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: